name: Offline verification

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python 3.11 / Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source without persistent credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11 with pip cache
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install the verified dependency set
        run: python -m pip install -r requirements.lock.txt

      - name: Run offline project verification
        run: python scripts/verify_project.py
